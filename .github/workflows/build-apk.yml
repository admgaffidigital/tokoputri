name: Build Android APK (Toko Putri)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/TokoPutri.apk
          echo "APK generated successfully at build-output/TokoPutri.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokoPutri-APK
          path: build-output/TokoPutri.apk
          retention-days: 30

      - name: Extract App Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
          name: Toko Putri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
          body: |
            ### 🚀 Rilis Resmi Toko Putri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
            
            Unduh file installer **TokoPutri.apk** di bawah untuk dipasang di smartphone Android.
            
            **Pusat Laporan & Keuangan Terpadu (v1.10.13):**
            - 📊 **Pusat Laporan & Keuangan Terpadu (7 Tab)**: Konsolidasi total seluruh laporan berserakan menjadi 1 menu khusus (Eksekutif Laba-Rugi P&L, Laporan Penjualan POS vs Web, Valuasi Stok Gudang & HPP, Utang Piutang & Working Capital, Beban Biaya Operasional, Kepatuhan Pajak RI 2026 CTAS 16-Digit, dan Neraca Sederhana).
            - 🧹 **Eliminasi Laporan Duplikat**: Menghapus widget mini laporan dan tombol lama di dashboard admin, membebaskan antarmuka dari redundansi data.
            - 🛡️ **Universal Zero-Shadow Shield & Flat Clarity**: Seluruh kartu, modal, header, dan elemen berpenampilan solid, bersih, kontras tinggi WCAG AAA, dan bebas bayangan blur.
            - 🔗 **Pintasan Cepat Antar-Modul**: Tombol lompat langsung dari kartu stok produk, tempo piutang, dan kulakan PO ke tab laporan terkait.
            - 📱 **Android Capacitor Native Sync**: Sinkronisasi penuh aset public, Android versionCode 11013, dan APK siap pasang.
          files: build-output/TokoPutri.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

