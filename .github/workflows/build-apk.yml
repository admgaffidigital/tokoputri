name: Build Android APK (Toko Putri)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/TokoPutri.apk
          echo "APK generated successfully at build-output/TokoPutri.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokoPutri-APK
          path: build-output/TokoPutri.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.8.5' }}
          name: Toko Putri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.8.5' }}
          body: |
            ### 🚀 Rilis Resmi Toko Putri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.8.5' }}
            
            Unduh file installer **TokoPutri.apk** di bawah untuk dipasang di smartphone Android.
            
            **Pembaruan Fitur Terbaru:**
            - 🖨️ **Pengaturan Universal POS & Printer**: Bluetooth Thermal ESC/POS, USB OTG, LAN/WiFi, System Print, dan RawBT (58mm & 80mm).
            - 🚪 **Dialog Konfirmasi Keluar**: Mencegah aplikasi tertutup tanpa sengaja saat tombol Back fisik ditekan.
            - 💬 **Navigasi WhatsApp Bebas Reload**: Kembali dari WhatsApp langsung ke Toko Putri tanpa kehilangan keranjang & transaksi.
            - 💳 **Kartu Member Digital 3D**: Barcode kasir Code128, tingkatan tier (Bronze, Silver, Gold, Platinum VIP), & auto-sinkron poin belanja.
            - 📱 **Splash Screen & Logo HD**: Animasi splash screen elegan dan ikon aplikasi resmi resolusi tinggi.
          files: build-output/TokoPutri.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

