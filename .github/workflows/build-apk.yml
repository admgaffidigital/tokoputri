name: Build Android APK (Toko Putri)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Release APK & Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Release Output
        run: |
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "build-output/TokoPutri.OfficialStore.apk"
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "build-output/TokoPutri.OfficialStore.apk"
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "build-output/TokoPutri.OfficialStore.aab"
          fi
          echo "Output files ready in build-output:"
          ls -la build-output/

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TokoPutri-OfficialStore-Binaries
          path: build-output/*
          retention-days: 30

      - name: Extract App Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
          name: Toko Putri ( Official Store ) ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
          body: |
            ### 🚀 Rilis Resmi Toko Putri ( Official Store ) ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
            
            Unduh file installer resmi:
            - **TokoPutri.OfficialStore.apk**: Installer siap pasang langsung di smartphone Android.
            - **TokoPutri.OfficialStore.aab**: Android App Bundle resmi untuk diunggah ke Google Play Console.
          files: |
            build-output/TokoPutri.OfficialStore.apk
            build-output/TokoPutri.OfficialStore.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

