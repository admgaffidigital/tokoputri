name: Build Android APK (Toko Putri)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/TokoPutri.apk
          echo "APK generated successfully at build-output/TokoPutri.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokoPutri-APK
          path: build-output/TokoPutri.apk
          retention-days: 30

      - name: Extract App Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
          name: Toko Putri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
          body: |
            ### 🚀 Rilis Resmi Toko Putri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
            
            Unduh file installer **TokoPutri.apk** di bawah untuk dipasang di smartphone Android.
            
            **Pembaruan Fitur Terbaru (v1.9.21):**
            - 💼 **Manajemen Shift Kasir & Modal Awal (Cash Float)**: Buka shift kasir dengan modal awal laci uang kembalian (chip cepat Rp 0, 50rb, 100rb, 200rb, 500rb) dan audio chime Web Audio API yang elegan.
            - 📊 **Ringkasan Shift Berjalan (X-Report)**: Pantau durasi kerja aktif, rincian omset per metode pembayaran (Tunai, QRIS, Bank, Tempo), diskon toko, poin member, dan uang kas yang seharusnya ada di laci.
            - 🔒 **Rekonsiliasi Kas Laci & Rekap Tutup Kasir (Z-Report)**: Alur tutup kasir profesional dengan dua mode hitung fisik (Input Cepat & Kalkulator Denominasi Lembaran), deteksi otomatis selisih kas (Pas, Surplus, Defisit), dan proteksi logout kasir.
            - 🖨️ **Cetak Slip Rekap Shift Thermal POS (58mm / 80mm)**: Cetak bukti settlement shift kasir resmi ke printer thermal (Bluetooth ESC/POS, RawBT, browser) lengkap dengan tanda tangan kasir & supervisor.
            - 📋 **Laporan Shift Kasir Cloud di CMS Admin**: Tab baru di menu Manajemen Kasir CMS Admin untuk mengaudit riwayat shift seluruh kasir dan mencetak ulang slip rekap kasir kapan saja.
            - ⌨️ **Pintasan Keyboard Shift (F10)**: Akses cepat modal ringkasan dan buka shift langsung dari keyboard kasir.
          files: build-output/TokoPutri.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

