name: Build Android APK (Toko Putri)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/TokoPutri.apk
          echo "APK generated successfully at build-output/TokoPutri.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokoPutri-APK
          path: build-output/TokoPutri.apk
          retention-days: 30

      - name: Extract App Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
          name: Toko Putri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
          body: |
            ### 🚀 Rilis Resmi Toko Putri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
            
            Unduh file installer **TokoPutri.apk** di bawah untuk dipasang di smartphone Android.
            
            **Pembaruan Fitur Terbaru (v1.9.2):**
            - 🔀 **Geser & Atur Urutan Produk (Drag & Drop Reorder)**: Seller bisa langsung tahan & geser kartu produk untuk mengatur urutan tampilan di toko — mendukung sentuh jari HP maupun drag mouse di komputer.
            - ⬆️⬇️ **Tombol Panah Naik/Turun Cepat**: Geser produk satu posisi per klik tanpa perlu drag jauh.
            - 🔢 **Badge Nomor Urut #1, #2, ... (Klik untuk Pindah)**: Klik badge untuk langsung pindah ke nomor tertentu via dialog.
            - 📦 **Rapikan per Kategori Otomatis**: Satu klik untuk mengelompokkan produk sejenis (paku, semen, cat) secara otomatis.
            - ⚡ **Menu Urutkan Cepat**: Pilihan A-Z, Z-A, Harga, Reset ke Terbaru — semuanya tersimpan permanen.
            - ☁️ **Auto-Save ke Cloud & Sinkron Real-Time**: Urutan langsung tersimpan ke Firestore dan tercermin di tampilan Beranda/Katalog pembeli.
            - 🔒 **Member Locking & Security (v1.9.1)**: Identitas member terkunci permanen di database, hardening Firestore rules.
            - 📍 **Drop-Point Delivery (v1.9.0)**: Kirim pesanan ke lokasi proyek/tukang yang berbeda dengan ongkir presisi.
          files: build-output/TokoPutri.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

