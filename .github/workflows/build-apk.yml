name: Build Android APK (Toko Putri)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/TokoPutri.apk
          echo "APK generated successfully at build-output/TokoPutri.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokoPutri-APK
          path: build-output/TokoPutri.apk
          retention-days: 30

      - name: Extract App Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
          name: Toko Putri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
          body: |
            ### 🚀 Rilis Resmi Toko Putri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg_version.outputs.tag }}
            
            Unduh file installer **TokoPutri.apk** di bawah untuk dipasang di smartphone Android.
            
            **Pembaruan Fitur Terbaru (v1.9.20):**
            - 🛒 **POS Kasir Pintar & Pemindai Barcode Kamera Interaktif**: Scan barcode dan QR via kamera smartphone/tablet/webcam dengan reticle animasi laser scanline, toggle flash/torch, dan audio beep instan.
            - 🧮 **Kalkulator Diskon Transaksi Cerdas (Rp & %)**: Diskon otomatis dual-mode dengan chips preset instan (5%, 10%, 15%, 20%, 50%, Rp 2rb, 5rb, 10rb, 25rb, 50rb).
            - 🚦 **Peringatan Stok Menipis & Penanda Habis**: Lencana visual HABIS dan SISA X di katalog kasir dengan validasi kuantitas belanja.
            - ⏸️ **Parkir Transaksi & Antrean Kasir (Hold & Recall Cart)**: Tahan dan panggil transaksi antrean pelanggan tanpa risiko kehilangan data disertai chime sintetis.
            - 🖨️ **Integrasi Universal Struk Printer Thermal ESC/POS**: Cetak struk kasir 58mm/80mm, Bluetooth ESC/POS, dan driver RawBT Android.
            - ⚡ **Persistensi Toggle Icon POS Kasir di Header**: Navigasi kasir 100% stabil saat muat ulang halaman dengan zero-latency local cache dan multi-tier verification.
          files: build-output/TokoPutri.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

